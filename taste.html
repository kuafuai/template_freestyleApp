<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taste of Beijing Roast Duck</title>
  <!-- Import the CSS file -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Display the taste of Beijing Roast Duck -->
  <h1>Taste</h1>
  <p>To taste Beijing Roast Duck, follow these steps:</p>
  <ol>
    <li>Take a piece of duck meat</li>
    <li>Spread sweet bean sauce on a pancake</li>
    <li>Add some sliced green onions</li>
    <li>Wrap the duck meat with the pancake</li>
    <li>Enjoy!</li>
  </ol>
</body>
