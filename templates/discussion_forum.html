<!DOCTYPE html>
<html>
<head>
    <title>Discussion Forum</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Discussion Forum</h1>
    <h2>Posts</h2>
    <div id="posts">
        {% for post in posts %}
        <div class="post">
            <p>{{ post.title }}</p>
            <p>Author: {{ post.author }}</p>
            <p>Content: {{ post.content }}</p>
        </div>
        {% endfor %}
    </div>

    <h2>Create Post</h2>
    <input type="text" id="postInput">
    <button onclick="createPost()">Create</button>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        function createPost() {
            var postInput = document.getElementById("postInput").value;
            if (postInput.trim() !== "") {
                var post = {
                    title: "Post " + (document.getElementsByClassName("post").length + 1),
                    author: "John Doe",
                    content: postInput
                };
                var postElement = document.createElement("div");
                postElement.className = "post";
                postElement.innerHTML = "<p>" + post.title + "</p><p>Author: " + post.author + "</p><p>Content: " + post.content + "</p>";
                document.getElementById("posts").appendChild(postElement);
                document.getElementById("postInput").value = "";
            }
        }
    </script>
</body>
</html>
