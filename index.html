<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <ul>
                <li><a href="#" onclick="showPage('register')">Product Registration</a></li>
                <li><a href="#" onclick="showPage('demo')">Product Demo</a></li>
                <li><a href="#" onclick="showPage('qa')">Product Q&A</a></li>
            </ul>
        </div>
        <div class="content">
            <div id="register" style="display: none;">
                <!-- Product Registration Form -->
                <h2>Product Registration</h2>
                <form id="registrationForm">
                    <label for="model">Model:</label>
                    <input type="text" id="model" name="model" required><br><br>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required><br><br>
                    <label for="spec">Specification:</label>
                    <input type="text" id="spec" name="spec" required><br><br>
                    <label for="releaseDate">Release Date:</label>
                    <input type="date" id="releaseDate" name="releaseDate" required><br><br>
                    <label for="price">Suggested Price:</label>
                    <input type="number" id="price" name="price" required><br><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
            <div id="demo" style="display: none;">
                <!-- Product Demo Search -->
                <h2>Product Demo</h2>
                <input type="text" id="searchDemo" placeholder="Enter keyword">
                <button onclick="searchDemo()">Search</button>
                <div id="demoResults"></div>
            </div>
            <div id="qa" style="display: none;">
                <!-- Product Q&A -->
                <h2>Product Q&A</h2>
                <input type="text" id="question" placeholder="Enter question or keyword">
                <button onclick="askQuestion()">Ask</button>
                <div id="qaResults"></div>
            </div>
        </div>
        <div class="sidebar">
            <div id="productInfo">
                <!-- Product Information -->
                <h2>Product Information</h2>
                <div id="productDetails"></div>
            </div>
        </div>
    </div>

    <script>
        function showPage(page) {
            var register = document.getElementById("register");
            var demo = document.getElementById("demo");
            var qa = document.getElementById("qa");

            register.style.display = "none";
            demo.style.display = "none";
            qa.style.display = "none";

            if (page === "register") {
                register.style.display = "block";
            } else if (page === "demo") {
                demo.style.display = "block";
            } else if (page === "qa") {
                qa.style.display = "block";
            }
        }

        function searchDemo() {
            var searchKeyword = document.getElementById("searchDemo").value;
            var demoResults = document.getElementById("demoResults");

            // Perform search logic here

            // Display search results
            demoResults.innerHTML = "Search results for: " + searchKeyword;
        }

        function askQuestion() {
            var question = document.getElementById("question").value;
            var qaResults = document.getElementById("qaResults");

            // Perform question logic here

            // Display question results
            qaResults.innerHTML = "Question: " + question;
        }
    </script>
</body>
</html>
