<!-- Add a timer to record the time taken to complete the game -->
<div id="timer">00:00</div>

<!-- Display the remaining number of mines -->
<div id="mines">Mines: 10</div>

<!-- Add game difficulty options -->
<div id="difficulty">
  <label for="easy">Easy</label>
  <input type="radio" id="easy" name="difficulty" value="easy" checked>
  <label for="medium">Medium</label>
  <input type="radio" id="medium" name="difficulty" value="medium">
  <label for="hard">Hard</label>
  <input type="radio" id="hard" name="difficulty" value="hard">
</div>

<!-- Add the game board -->
<div id="board">
  <!-- The game board will be dynamically generated using JavaScript -->
</div>

<!-- Include the script.js file -->
<script src="script.js"></script>
