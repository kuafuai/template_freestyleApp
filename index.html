<!DOCTYPE html>
<html>
<head>
  <title>储能订单系统</title>
  <link rel="stylesheet" type="text/css" href="semantic.min.css">
  <script src="main.js"></script>
</head>
<body>
  <div class="ui three column grid">
    <div class="column">
      <!-- Map section -->
      <div id="map"></div>
    </div>
    <div class="column">
      <!-- Monster list section -->
      <div class="ui segment">
        <h2 class="ui header">妖怪列表</h2>
        <div id="monster-list"></div>
      </div>
    </div>
    <div class="column">
      <!-- Monster details section -->
      <div class="ui segment">
        <h2 class="ui header">妖怪详细信息</h2>
        <div id="monster-details"></div>
      </div>
    </div>
  </div>
</body>
</html>
