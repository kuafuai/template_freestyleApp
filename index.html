<!-- This file is responsible for the game interface and interaction logic -->

<!-- Include necessary CSS and JavaScript files -->
<link rel="stylesheet" type="text/css" href="jssemantic-ui.css">
<link rel="stylesheet" type="text/css" href="style.css">
<script src="jssemantic-ui.js"></script>
<script src="script.js"></script>

<!-- Game interface -->
<div id="game-container">
  <div id="grid-container">
    <!-- Generate game grid with Pokémon -->
    <div class="pokemon">Pikachu</div>
    <div class="pokemon">Charmander</div>
    <div class="pokemon">Squirtle</div>
    <div class="pokemon">Bulbasaur</div>
  </div>
  <div id="score-container">
    <!-- Display player's score -->
    <div id="score">Score: 0</div>
  </div>
  <div id="goal-container">
    <!-- Display level goal -->
    <div id="goal">Goal: 100</div>
  </div>
  <div id="toolbox-container">
    <!-- Display Pokémon toolbox -->
    <div id="toolbox">
      <div class="pokemon">Pikachu</div>
      <div class="pokemon">Charmander</div>
      <div class="pokemon">Squirtle</div>
      <div class="pokemon">Bulbasaur</div>
    </div>
  </div>
  <div id="message-container">
    <!-- Display game messages -->
    <div id="message">Welcome to the Pokémon game!</div>
  </div>
  <div id="button-container">
    <!-- Display game buttons -->
    <button id="start-button">Start</button>
    <button id="reset-button">Reset</button>
  </div>
</div>
