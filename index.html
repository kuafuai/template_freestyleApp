<!DOCTYPE html>
<html>
<head>
    <title>Elderly Monitoring System</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Elderly Monitoring System</h1>
    <div id="data-container">
        <h2>Personal Information</h2>
        <p id="name"></p>
        <p id="age"></p>
        <h2>Health Information</h2>
        <p id="oxygen"></p>
        <p id="blood-pressure"></p>
        <h2>Emergency Contact</h2>
        <p id="emergency-contact-name"></p>
        <p id="emergency-contact-phone"></p>
    </div>
    <button id="emergency-contact-button">Emergency Contact</button>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
