<!DOCTYPE html>
<html>
<head>
  <title>Color Matching Game</title>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="ui container">
    <h1 class="ui header">Color Matching Game</h1>
    <div id="card-area" class="ui grid"></div>
    <div id="scoreboard" class="ui segment">
      <h2 class="ui header">Score: <span id="score">0</span></h2>
      <h2 class="ui header">Time Remaining: <span id="time">5:00</span></h2>
    </div>
    <button id="restart-button" class="ui button">Restart Game</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
