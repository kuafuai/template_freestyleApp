<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Color Matching Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        #card-area {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: gray;
            border-radius: 5px;
            cursor: pointer;
        }

        #score-area {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="card-area">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>
    <div id="score-area">Score: 0</div>

    <script src="script.js"></script>
</body>
</html>
