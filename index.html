<!DOCTYPE html>
<html>
<head>
    <title>Power Company Navigation</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Power Companies</h2>
            <ul id="company-list">
                <!-- The list of power companies will be dynamically populated here -->
            </ul>
        </div>
        <div class="content">
            <h2>Search Results</h2>
            <input type="text" id="search-input" placeholder="Search company...">
            <button id="search-button">Search</button>
            <ul id="search-results">
                <!-- The search results will be dynamically populated here -->
            </ul>
        </div>
        <div class="info">
            <h2>Company Details</h2>
            <p id="company-website"></p>
            <button id="open-website-button">Open Website</button>
        </div>
    </div>
</body>
</html>
