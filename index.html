<!DOCTYPE html>
<html>
<head>
    <title>磐安旅游</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="jssemantic-ui.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <div class="video-container">
        <!-- Display the promotional video -->
        <video src="promo_video.mp4" autoplay loop muted></video>
    </div>
    <div class="image-container">
        <!-- Display the promotional images -->
        <img src="promo_image1.jpg" alt="Promo Image 1">
        <img src="promo_image2.jpg" alt="Promo Image 2">
        <img src="promo_image3.jpg" alt="Promo Image 3">
    </div>
    <div class="entry-container">
        <!-- Entry point for tour customization -->
        <a href="tour_customization.html">
            <img src="tour_customization.jpg" alt="Tour Customization">
        </a>
        <!-- Entry point for smart guide -->
        <a href="smart_guide.html">
            <img src="smart_guide.jpg" alt="Smart Guide">
        </a>
    </div>
    <script>
        document.getElementById("tourCustomization").addEventListener("click", goToTourCustomization);
        document.getElementById("smartGuide").addEventListener("click", goToSmartGuide);

        function goToTourCustomization() {
            try {
                window.location.href = "tour_customization.html";
            } catch (error) {
                console.error("Error navigating to tour_customization.html:", error);
            }
        }

        function goToSmartGuide() {
            try {
                window.location.href = "smart_guide.html";
            } catch (error) {
                console.error("Error navigating to smart_guide.html:", error);
            }
        }
    </script>
</body>
</html>
