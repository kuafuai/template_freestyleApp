<!DOCTYPE html>
<html>
<head>
    <title>欢迎来磐安旅游</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/layout.css">
</head>
<body>
    <div class="container">
        <div class="column">
            <div class="video-container">
                <video src="video/travel_video.mp4" controls></video>
                <div class="video-title">磐安文旅</div>
            </div>
        </div>
        <div class="column">
            <img src="images/travel_image1.jpg" alt="Travel Image 1">
        </div>
        <div class="column">
            <img src="images/travel_image2.jpg" alt="Travel Image 2">
        </div>
    </div>
    <div class="buttons">
        <button id="customizationButton">旅游路线定制</button>
        <button id="guideButton">智能导览</button>
    </div>

    <script>
        // Function to navigate to the customization page
        function goToCustomization() {
            try {
                window.location.href = "customization.html";
            } catch (error) {
                console.error("Error navigating to customization page:", error);
                alert("An error occurred while navigating to the customization page. Please try again later.");
            }
        }

        // Function to navigate to the guide page
        function goToGuide() {
            try {
                window.location.href = "guide.html";
            } catch (error) {
                console.error("Error navigating to guide page:", error);
                alert("An error occurred while navigating to the guide page. Please try again later.");
            }
        }

        // Add event listeners to the buttons
        document.getElementById("customizationButton").addEventListener("click", goToCustomization);
        document.getElementById("guideButton").addEventListener("click", goToGuide);
    </script>
</body>
</html>
