<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sales Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <ul>
                <li><a href="#" data-page="register">Product Registration</a></li>
                <li><a href="#" data-page="demo">Product Demo</a></li>
                <li><a href="#" data-page="qa">Product Q&A</a></li>
            </ul>
        </div>
        <div class="content">
            <div id="register" style="display: none;">
                <!-- Product Registration Form -->
                <h2>Product Registration</h2>
                <form id="registrationForm">
                    <label for="model">Model:</label>
                    <input type="text" id="model" name="model" required><br><br>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required><br><br>
                    <label for="spec">Specification:</label>
                    <input type="text" id="spec" name="spec" required><br><br>
                    <label for="releaseDate">Release Date:</label>
                    <input type="date" id="releaseDate" name="releaseDate" required><br><br>
                    <label for="price">Suggested Price:</label>
                    <input type="number" id="price" name="price" required><br><br>
                    <input type="submit" value="Submit">
                </form>
            </div>
            <div id="demo" style="display: none;">
                <!-- Product Demo Search -->
                <h2>Product Demo</h2>
                <input type="text" id="searchDemo" placeholder="Enter keyword">
                <button id="searchDemoBtn">Search</button>
                <div id="demoResults"></div>
            </div>
            <div id="qa" style="display: none;">
                <!-- Product Q&A -->
                <h2>Product Q&A</h2>
                <input type="text" id="question" placeholder="Enter question or keyword">
                <button id="askQuestionBtn">Ask</button>
                <div id="qaResults"></div>
            </div>
        </div>
        <div class="sidebar">
            <div id="productInfo">
                <!-- Product Information -->
                <h2>Product Information</h2>
                <div id="productDetails"></div>
            </div>
        </div>
    </div>
    <script>
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            var links = document.querySelectorAll('.sidebar ul li a');
            links.forEach(function(link) {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    var page = this.getAttribute('data-page');
                    showPage(page);
                });
            });

            var registrationForm = document.getElementById('registrationForm');
            registrationForm.addEventListener('submit', function(event) {
                event.preventDefault();
                // Handle form submission logic here
            });

            var searchDemoBtn = document.getElementById('searchDemoBtn');
            searchDemoBtn.addEventListener('click', function() {
                var keyword = document.getElementById('searchDemo').value;
                // Handle search demo logic here
            });

            var askQuestionBtn = document.getElementById('askQuestionBtn');
            askQuestionBtn.addEventListener('click', function() {
                var question = document.getElementById('question').value;
                // Handle ask question logic here
            });
        });

        // Function to show page
        function showPage(page) {
            var pages = document.querySelectorAll('.content > div');
            pages.forEach(function(pageElement) {
                if (pageElement.id === page) {
                    pageElement.style.display = 'block';
                } else {
                    pageElement.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
