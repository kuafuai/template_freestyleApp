<!-- The purpose of this file is to create the structure and content of a webpage for a "储能订单系统" (Energy Storage Order System).
     It contains HTML markup and uses the Semantic UI library for styling. -->

<!DOCTYPE html>
<html>
<head>
  <title>储能订单系统</title>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
  <style>
    /* Define the style of the game area */
    .game-area {
      width: 400px;
      height: 400px;
      background-color: blue;
    }
    
    /* Define the style of the scoreboard */
    .scoreboard {
      margin-top: 10px;
      text-align: center;
    }
    
    /* Define the style of the start button */
    .start-button {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ui container">
    <h1 class="ui header">储能订单系统</h1>
    <div class="game-area"></div>
    <div class="scoreboard">Score: <span id="score">0</span></div>
    <div class="start-button">
      <button class="ui primary button" id="start-button">Start</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
