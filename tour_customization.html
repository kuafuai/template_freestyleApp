<!DOCTYPE html>
<html>
<head>
    <title>旅游线路定制</title>
    <meta charset='UTF-8'>
    <link rel='stylesheet' type='text/css' href='styles.css'>
    <script src='tour_customization.js'></script>
</head>
<body>
    <h1>旅游线路定制</h1>
    <form id='tour-form'>
        <label for='personnel'>出行人员数量:</label>
        <input type='number' id='personnel' name='personnel' min='1' required>
        <br>
        <label for='member-type'>成员类型:</label>
        <select id='member-type' name='member-type' required>
            <option value='young'>年轻人</option>
            <option value='family'>家庭团</option>
            <option value='elderly'>老年团</option>
        </select>
        <br>
        <label for='days'>游玩天数:</label>
        <input type='number' id='days' name='days' min='1' required>
        <br>
        <label for='scenic-type'>游览景点特点:</label>
        <select id='scenic-type' name='scenic-type' required>
            <option value='natural'>自然风光</option>
            <option value='summer'>夏日嬉水</option>
            <option value='cultural'>人文景观</option>
            <option value='camping'>露营烧烤</option>
        </select>
        <br>
        <button type='submit'>计算</button>
    </form>

    <div id='tour-results'>
        <!-- Display the recommended tour plans and routes -->
    </div>

    <script>
        function calculateRoute() {
            const personnel = document.getElementById('personnel').value;
            const memberType = document.getElementById('member-type').value;
            const days = document.getElementById('days').value;
            const scenicSpot = document.getElementById('scenic-type').value;

            // Validate the input values
            if (isNaN(personnel) || isNaN(days) || personnel <= 0 || days <= 0) {
                alert('人员数量和天数必须是正整数');
                return;
            }

            // Calculate the route and cost based on the user's input
            let route = '';
            let cost = 0;

            // Add logic to calculate the route and cost based on the user's input
            switch (memberType) {
                case 'young':
                    if (scenicSpot === 'natural') {
                        route = 'A';
                        cost = personnel * 1000 * days;
                    } else if (scenicSpot === 'summer') {
                        route = 'B';
                        cost = personnel * 1200 * days;
                    } else if (scenicSpot === 'cultural') {
                        route = 'C';
                        cost = personnel * 1500 * days;
                    } else if (scenicSpot === 'camping') {
                        route = 'D';
                        cost = personnel * 800 * days;
                    }
                    break;
                case 'family':
                    if (scenicSpot === 'natural') {
                        route = 'E';
                        cost = personnel * 1500 * days;
                    } else if (scenicSpot === 'summer') {
                        route = 'F';
                        cost = personnel * 1800 * days;
                    } else if (scenicSpot === 'cultural') {
                        route = 'G';
                        cost = personnel * 2000 * days;
                    } else if (scenicSpot === 'camping') {
                        route = 'H';
                        cost = personnel * 1000 * days;
                    }
                    break;
                case 'elderly':
                    if (scenicSpot === 'natural') {
                        route = 'I';
                        cost = personnel * 1200 * days;
                    } else if (scenicSpot === 'summer') {
                        route = 'J';
                        cost = personnel * 1500 * days;
                    } else if (scenicSpot === 'cultural') {
                        route = 'K';
                        cost = personnel * 1800 * days;
                    } else if (scenicSpot === 'camping') {
                        route = 'L';
                        cost = personnel * 900 * days;
                    }
                    break;
            }

            // Redirect to the result page with the calculated route and cost
            window.location.href = 'tour_result.html?route=' + encodeURIComponent(route) + '&cost=' + encodeURIComponent(cost);
        }
    </script>
</body>
</html>
