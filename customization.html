<!DOCTYPE html>
<html>
<head>
    <title>Travel Route Customization</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body>
    <h1>Travel Route Customization</h1>
    <form id="customizationForm" onsubmit="handleFormSubmission(event)">
        <label for="travelers">Number of Travelers:</label>
        <input type="number" id="travelers" name="travelers" required><br><br>
        <label for="preferences">Preferences:</label>
        <textarea id="preferences" name="preferences" required></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
    <div id="recommendation"></div>
    <div id="transportation"></div>

    <script>
        // Function to handle form submission
        function handleFormSubmission(event) {
            event.preventDefault(); // Prevent form from submitting

            // Get form data
            var travelers = document.getElementById("travelers").value;
            var preferences = document.getElementById("preferences").value;

            // Validate form data
            if (travelers === "" || preferences === "") {
                alert("Please fill in all fields");
                return;
            }

            // Submit form data
            submitCustomization(travelers, preferences);
        }

        // Function to submit form data
        function submitCustomization(travelers, preferences) {
            // Perform customization logic here

            // Display recommendation and transportation information
            var recommendationDiv = document.getElementById("recommendation");
            var transportationDiv = document.getElementById("transportation");

            recommendationDiv.innerHTML = "Recommendation: ..."; // Replace ... with actual recommendation
            transportationDiv.innerHTML = "Transportation: ..."; // Replace ... with actual transportation information
        }
    </script>
</body>
</html>
